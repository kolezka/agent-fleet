# agent-fleet config. Sourced by bash on the Mac (fleet CLI) and on the agent host (watchdog.sh).
FLEET=myfleet                                   # prefix for the watchdog tmux session: <FLEET>-watchdog
REMOTE_SSH="ssh -o BatchMode=yes -p 22 me@agent-host"   # empty = agents run on this machine
REMOTE_USER=                                    # set when you ssh as root and agents run as another user (su - USER)
FLEET_DIR=/home/me/fleets/myfleet               # fleet dir ON THE AGENT HOST (prompts, watchdog.sh, watchdog.log)
AGENT_CWD=/home/me/src/repo                     # where new agents start (a checkout; agents make their own worktrees)
CLAUDE_CONFIG_DIR=                              # optional, exported for the agents
CLAUDE_ARGS="--dangerously-skip-permissions"    # unattended agents; hard limits live in autonomy.txt
AGENT_KIND=claude                               # claude, or dsh for DeepSeek Harness agents (README, "DeepSeek Harness agents")
DSH_ARGS="--permission-mode workspace-write"    # AGENT_KIND=dsh only: extra dsh --profile headless arguments
END_AT=2100-01-01T00:00:00Z                     # watchdog exits at this UTC time; agents keep running
CTX_MAX=85                                      # % of context at which an agent is asked to hand off and is replaced
DISK_PATH=/home; DISK_MIN_G=40                  # low-disk warning
# One row per agent: tmux session | claude session title | prompt file in FLEET_DIR
AGENTS=(
  "agent-a|Fleet: Agent A|agent-a.txt"
  "agent-b|Fleet: Agent B|agent-b.txt"
)
